name: Rust

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  CARGO_MANIFEST_DIR: RCM-lib

jobs:
  check:
    name: fmt · clippy · build · test · let
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RCM-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RCM-lib

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --verbose

      - name: test
        run: cargo test --verbose

      - name: LET smoke (dry-run)
        run: |
          set -euo pipefail
          cargo run --quiet -- let init
          cargo run --quiet -- let cargo --dry-run
          cargo run --quiet -- let cargo --dry-run --json
          cargo run --quiet -- let pmll-anchor --dry-run || true

  publish:
    name: crates.io publish
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: CARGO_REGISTRY_TOKEN
    defaults:
      run:
        working-directory: RCM-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RCM-lib

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
